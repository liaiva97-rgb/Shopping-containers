<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏪 Container Shopping — Real Shop Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
    background: #f5f0fa;
    min-height: 100vh;
    padding: 16px;
    color: #5a4a5a;
    overflow-x: hidden;
  }
  .game-wrap { max-width: 1100px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 12px; }
  .header h1 {
    font-size: 26px; color: #ff6b9d;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(255,107,157,0.15);
    letter-spacing: 1px; font-weight: 800;
  }
  .header p { font-size: 13px; color: #a080a0; margin-top: 4px; }

  /* ===== LOCATION BADGE ===== */
  .location-badge {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #fff; border: 3px solid #ffd6e8; border-radius: 20px;
    padding: 6px 18px; margin: 0 auto 12px; width: fit-content;
    box-shadow: 0 3px 0 #ffd6e8; font-weight: 800; color: #ff6b9d;
    font-size: 14px;
  }
  .location-badge .loc-icon {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat {
    background: #fff; border: 3px solid #ffd6e8; border-radius: 16px;
    padding: 8px 6px; text-align: center; box-shadow: 0 3px 0 #ffd6e8;
    font-size: 11px; font-weight: 800; color: #a080a0;
  }
  .stat span { display: block; font-size: 20px; color: #ff6b9d; margin-top: 2px; }
  #timerBox.warn span { color: #ff3d3d; animation: pulse 0.5s infinite; }
  @keyframes pulse { 50% { transform: scale(1.2); } }

  .difficulty { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .diff-btn {
    padding: 6px 18px; border-radius: 20px; border: 3px solid #b8e6ff;
    background: #fff; color: #5a9ac0; cursor: pointer; font-weight: 800;
    font-size: 13px; font-family: inherit; box-shadow: 0 3px 0 #b8e6ff;
    transition: all 0.15s;
  }
  .diff-btn.active {
    background: #b8e6ff; color: #fff;
    transform: translateY(2px); box-shadow: 0 1px 0 #b8e6ff;
  }

  .list-card {
    background: #fffbe6; border: 3px dashed #ffd166; border-radius: 16px;
    padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 3px 0 #ffd166;
  }
  .list-card h3 { font-size: 14px; color: #e8a33d; margin-bottom: 6px; }
  .list-card ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .list-card li {
    background: #fff; padding: 4px 10px; border-radius: 20px;
    border: 2px solid #ffd166; font-size: 12px; font-weight: 700;
    color: #8a6a3a; display: flex; align-items: center; gap: 4px;
  }
  .list-card li svg { width: 18px; height: 18px; }
  .list-card li.done {
    background: #b8f0d0; border-color: #6bd39c; color: #3a8a5a;
    text-decoration: line-through; opacity: 0.8;
  }

  /* ===== SHOP SCENE (главное!) ===== */
  .shop-scene {
    position: relative;
    border-radius: 24px; margin-bottom: 14px;
    border: 4px solid #fff; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 6px 0 rgba(0,0,0,0.06);
    min-height: 420px;
    transition: min-height 0.3s;
    background: #ccc;
  }

  /* Фото-фон локации */
  .loc-bg {
    position: absolute; inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 0.6s, transform 0.6s;
  }
  .loc-bg::after {
    /* Затемняющая вуаль для читаемости */
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.55) 100%);
  }

  .scene-content {
    position: relative; z-index: 2;
    padding: 20px 20px 0;
  }

  .shelves {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 8px 8px; margin-bottom: 12px;
    background: rgba(255,255,255,0.75);
    border-radius: 16px; padding: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .item {
    background: #fff; border-radius: 12px; padding: 6px 4px 4px;
    text-align: center; cursor: grab; transition: all 0.15s;
    border: 2px solid #ffe8f0; user-select: none;
    box-shadow: 0 3px 0 #ffe8f0; position: relative;
  }
  .item:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 0 #ffe8f0, 0 8px 15px rgba(255,107,157,0.25);
  }
  .item:active { cursor: grabbing; }
  .item.dragging { opacity: 0.4; transform: scale(0.9); }
  .item.collected { opacity: 0; transform: scale(0); pointer-events: none; transition: all 0.5s; }
  .item .pic {
    width: 54px; height: 54px; margin: 0 auto 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .item .pic svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.12)); }
  .item .name { font-size: 9px; font-weight: 800; color: #a080a0; }

  .character-area {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 12px; padding: 8px 0 20px; position: relative; z-index: 1;
    min-height: 130px;
  }
  .character {
    width: 100px; height: 120px;
    animation: bob 2.5s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    position: relative;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .cart {
    width: 85px; height: 85px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    transition: transform 0.3s;
  }
  .cart.bump { animation: bump 0.4s; }
  @keyframes bump {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15) rotate(-5deg); }
  }
  .speech-bubble {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    background: #fff; border: 3px solid #ffd6e8; border-radius: 16px;
    padding: 6px 12px; font-size: 12px; font-weight: 800; color: #ff6b9d;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s; z-index: 10;
  }
  .speech-bubble::after {
    content: ''; position: absolute; bottom: -10px; left: 50%;
    transform: translateX(-50%); border: 7px solid transparent;
    border-top-color: #ffd6e8;
  }
  .speech-bubble.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

  .containers-title { text-align: center; font-size: 13px; color: #a080a0; margin-bottom: 8px; font-weight: 800; }
  .containers { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .container {
    background: #fff; border: 3px dashed #b8e6ff; border-radius: 16px;
    padding: 8px 4px 6px; text-align: center; font-size: 10px; font-weight: 800;
    color: #5a9ac0; min-height: 86px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; transition: all 0.2s;
    box-shadow: 0 3px 0 #b8e6ff; position: relative;
  }
  .container .icon { width: 44px; height: 44px; margin-bottom: 2px; }
  .container .icon svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1)); }
  .container.drop-hover {
    background: #e0f7ff; border-style: solid; border-color: #6bc7ff;
    transform: scale(1.08) translateY(-2px); box-shadow: 0 6px 0 #6bc7ff;
  }
  .container.correct {
    background: #b8f0d0; border-color: #6bd39c; color: #2a7a4a;
    box-shadow: 0 3px 0 #6bd39c; animation: pop 0.4s;
  }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .container.wrong {
    background: #ffd6d6; border-color: #ff8080; color: #c04040;
    box-shadow: 0 3px 0 #ff8080; animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .message {
    text-align: center; padding: 10px; border-radius: 14px; margin-bottom: 12px;
    font-weight: 800; font-size: 14px; min-height: 42px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .message.ok { background: #d0f5e0; color: #2a7a4a; border: 2px solid #6bd39c; }
  .message.err { background: #ffe0e0; color: #c04040; border: 2px solid #ff8080; }
  .message:empty { background: transparent; border: none; }

  .btn {
    display: block; margin: 0 auto;
    background: linear-gradient(180deg, #ff8db5 0%, #ff6b9d 100%);
    color: #fff; border: none; padding: 12px 30px; border-radius: 25px;
    font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 0 #d94a7a; transition: all 0.15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #d94a7a; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d94a7a; }

  .win-screen {
    display: none; text-align: center; padding: 30px 20px; background: #fff;
    border-radius: 24px; border: 4px solid #ffd6e8; box-shadow: 0 6px 0 #ffd6e8;
  }
  .win-screen.active { display: block; }
  .win-screen h2 { color: #ff6b9d; font-size: 28px; margin-bottom: 12px; }
  .win-screen .big-pic { width: 140px; height: 140px; margin: 0 auto 12px; display: block; }
  .win-screen p { font-size: 15px; color: #a080a0; margin-bottom: 18px; }

  .hint {
    text-align: center; font-size: 12px; color: #a080a0;
    margin-bottom: 10px; font-weight: 700;
  }

  @media (max-width: 500px) {
    .header h1 { font-size: 20px; }
    .character { width: 75px; height: 90px; }
    .cart { width: 65px; height: 65px; }
    .item .pic { width: 42px; height: 42px; }
    .item .name { font-size: 8px; }
    .shelves { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); padding: 8px; }
    .containers { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
    .container .icon { width: 36px; height: 36px; }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="header">
    <h1>🌍 Container Shopping — World Tour</h1>
    <p>Помоги Миле собрать покупки в разных магазинах мира!</p>
  </div>

  <div class="location-badge">
    <span class="loc-icon" id="locIcon"></span>
    <span id="locName">Loading...</span>
  </div>

  <div class="difficulty">
    <button class="diff-btn active" data-diff="easy">🌸 Easy</button>
    <button class="diff-btn" data-diff="medium">🌼 Medium</button>
    <button class="diff-btn" data-diff="hard">🌺 Hard</button>
  </div>

  <div class="stats">
    <div class="stat">⭐ Score<span id="score">0</span></div>
    <div class="stat">📦 Items<span id="progress">0/0</span></div>
    <div class="stat">❌ Mistakes<span id="mistakes">0</span></div>
    <div class="stat" id="timerBox">⏱ Time<span id="timer">--</span></div>
  </div>

  <div class="list-card">
    <h3>📋 Shopping List</h3>
    <ul id="list"></ul>
  </div>

  <div class="shop-scene" id="shopScene">
    <div class="loc-bg" id="locBg"></div>
    <div class="scene-content">
      <div class="shelves" id="shelf"></div>
      <div class="character-area">
        <div style="position:relative;">
          <div class="speech-bubble" id="speech"></div>
          <div class="character" id="character"></div>
        </div>
        <div class="cart" id="cart"></div>
      </div>
    </div>
  </div>

  <p class="hint">👇 Перетащи товар с полки в правильный контейнер</p>

  <div class="containers-title">📦 Pick the right container:</div>
  <div class="containers" id="containers"></div>

  <div class="message" id="message"></div>

  <div class="win-screen" id="winScreen">
    <div class="big-pic" id="winPic"></div>
    <h2>Well done!</h2>
    <p id="finalMsg"></p>
    <button class="btn" onclick="startGame()">🎮 Play Again</button>
  </div>

  <button class="btn" id="restartBtn" onclick="startGame()">🔄 New Game</button>
</div>

<script>

//  и замените URL на 'images/backgrounds/farm.jpg' и т.п.
// ============================================================

};

  farm: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M3 20 L3 12 L12 6 L21 12 L21 20 Z" fill="#c04040" stroke="#802020" stroke-width="1.5"/><rect x="9" y="14" width="6" height="6" fill="#fff8e0" stroke="#802020" stroke-width="1"/></svg>`,

  market: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M3 8 L21 8 L18 14 L6 14 Z" fill="#a0e878" stroke="#60a040" stroke-width="1.5"/><rect x="4" y="16" width="16" height="4" fill="#c89860" stroke="#806040" stroke-width="1"/></svg>`,
  sweetshop: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M6 20 L6 12 Q6 8 12 8 Q18 8 18 12 L18 20 Z" fill="#ff6b9d" stroke="#c04070" stroke-width="1.5"/><circle cx="12" cy="6" r="2" fill="#ffd166"/></svg>`,

//  ЛОКАЦИИ
// ============================================================
const LOCATIONS = {
  farm:        { name: 'Milk Farm',    icon: 'farm',        items: ['milk','cream','eggs12','cheese','butter','yogurt','juice'] },
  bakery:      { name: 'Bakery',       icon: 'bakery',      items: ['bread','biscuits','cake','pizza','pasta','flour','chocolate'] },
  market:      { name: 'Green Market', icon: 'market',      items: ['grapes','bananas','carrots','apples','potatoes','fruit','jam','honey'] },

const LOCATION_ORDER = ['farm','bakery','market','sweetshop','supermarket'];

// ============================================================
//  УЛУЧШЕННЫЕ SVG ТОВАРОВ (с градиентами, бликами, тенями)
// ============================================================
const svg = (content, vb = "0 0 60 60") =>

// Универсальная тень на полке (для каждого товара)

const ITEM_SVG = {

  cream: svg(`

  eggs12: svg(`
    <defs>
      <linearGradient id="eggBox" x1="0" y1="0" x2="0" y2="1">

    <ellipse cx="38" cy="28" rx="5" ry="4" fill="url(#eggGrad)" stroke="#d0b898" stroke-width="0.8"/>
    <ellipse cx="22" cy="40" rx="5" ry="4" fill="url(#eggGrad)" stroke="#d0b898" stroke-width="0.8"/>

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
let state = {
  targetItems: [], collected: [], score: 0, mistakes: 0,
  diff: 'easy', timer: null, timeLeft: 0, locked: false,
  locationIndex: 0
};

const $ = id => document.getElementById(id);
const $list = $('list'), $shelf = $('shelf'), $containers = $('containers');
const $message = $('message'), $score = $('score'), $progress = $('progress');
const $mistakes = $('mistakes'), $timer = $('timer'), $timerBox = $('timerBox');
const $winScreen = $('winScreen'), $finalMsg = $('finalMsg'), $restartBtn = $('restartBtn');
const $speech = $('speech'), $character = $('character'), $cart = $('cart');
const $locIcon = $('locIcon'), $locName = $('locName'), $locBg = $('locBg');

const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

// ============================================================
//  ОТРИСОВКА ЛОКАЦИИ
// ============================================================
function renderLocation(locKey) {
  const loc = LOCATIONS[locKey];
  $locIcon.innerHTML = LOCATION_ICONS[loc.icon];
  $locName.textContent = loc.name;
  $locBg.style.backgroundImage = `url('${LOCATION_BG[locKey]}')`;
  $locBg.style.opacity = '1';
}

// ============================================================
//  СТАРТ
// ============================================================
function startGame() {
  clearInterval(state.timer);
  state.locationIndex = 0;
  const locKey = LOCATION_ORDER[state.locationIndex];
  const loc = LOCATIONS[locKey];

  const pool = loc.items.map(id => ITEMS.find(i => i.id === id)).filter(Boolean);
  const targets = shuffle(pool).slice(0, Math.min(6, pool.length));

  state = {
    ...state,
    targetItems: targets.map(t => t.id),
    collected: [], score: 0, mistakes: 0,
    timer: null, timeLeft: 0, locked: false
  };

  renderLocation(locKey);
  setupRound(targets);
  updateStats();
  hideMessage();
  hideSpeech();
  $winScreen.classList.remove('active');
  $restartBtn.style.display = 'block';
  $character.innerHTML = CHARACTER_SVG;
  $cart.innerHTML = CART_SVG;
  $winScreen.querySelector('#winPic').innerHTML = WIN_SVG;
}

function setupRound(targets) {
  const locKey = LOCATION_ORDER[state.locationIndex];
  const loc = LOCATIONS[locKey];

  let shelfItems = [...targets];
  const extras = shuffle(
    loc.items.map(id => ITEMS.find(i => i.id === id))
      .filter(i => i && !targets.find(t => t.id === i.id))
  );
  while (shelfItems.length < 12 && extras.length) shelfItems.push(extras.shift());
  if (shelfItems.length < 8) {
    const globalExtras = shuffle(ITEMS.filter(i => !shelfItems.find(s => s.id === i.id)));
    while (shelfItems.length < 8 && globalExtras.length) shelfItems.push(globalExtras.shift());
  }
  shelfItems = shuffle(shelfItems);

  renderList();
  renderShelf(shelfItems);
  renderContainers();
}

function nextLocation() {
  state.locationIndex = (state.locationIndex + 1) % LOCATION_ORDER.length;
  const locKey = LOCATION_ORDER[state.locationIndex];
  const loc = LOCATIONS[locKey];

  const pool = loc.items.map(id => ITEMS.find(i => i.id === id)).filter(Boolean);
  const targets = shuffle(pool).slice(0, Math.min(6, pool.length));
  state.targetItems = targets.map(t => t.id);
  state.collected = [];
  state.locked = false;

  $locBg.style.opacity = '0';
  setTimeout(() => {
    renderLocation(locKey);
  }, 300);

  setTimeout(() => {
    setupRound(targets);
    updateStats();
    hideMessage();
    hideSpeech();
  }, 500);
}

function renderList() {
  $list.innerHTML = '';
  state.targetItems.forEach(id => {
    const item = ITEMS.find(i => i.id === id);
    const li = document.createElement('li');
    li.innerHTML = `<span style="width:18px;height:18px;display:inline-block;">${ITEM_SVG[id] || ''}</span>${item.name}`;
    if (state.collected.includes(id)) li.classList.add('done');
    $list.appendChild(li);
  });
}

function renderShelf(items) {
  $shelf.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.id = item.id;
    div.draggable = true;
    if (state.collected.includes(item.id)) div.classList.add('collected');
    div.innerHTML = `<div class="pic">${ITEM_SVG[item.id] || ''}</div><span class="name">${item.name}</span>`;

    div.addEventListener('dragstart', e => {
      if (state.locked || state.collected.includes(item.id)) { e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', item.id);
      div.classList.add('dragging');
      startTimer();
    });
    div.addEventListener('dragend', () => div.classList.remove('dragging'));

    div.addEventListener('touchstart', handleTouchStart, { passive: false });
    div.addEventListener('touchmove', handleTouchMove, { passive: false });
    div.addEventListener('touchend', handleTouchEnd, { passive: false });

    $shelf.appendChild(div);
  });
}

function renderContainers() {
  const needed = new Set(state.targetItems.map(id => {
    const it = ITEMS.find(i => i.id === id);
    return it ? it.container : null;
  }).filter(Boolean));

  const cfg = DIFFICULTY[state.diff];
  const pool = ALL_CONTAINERS.filter(c => !needed.has(c));
  const extras = shuffle(pool).slice(0, Math.max(0, cfg.options - needed.size));
  const containers = shuffle([...needed, ...extras]);

  $containers.innerHTML = '';
  containers.forEach(name => {
    const div = document.createElement('div');
    div.className = 'container';
    div.dataset.container = name;
    div.innerHTML = `<div class="icon">${CONTAINER_SVG[name] || ''}</div><span>${name}</span>`;

    div.addEventListener('dragover', e => {
      e.preventDefault();
      if (!state.locked) div.classList.add('drop-hover');
    });
    div.addEventListener('dragleave', () => div.classList.remove('drop-hover'));
    div.addEventListener('drop', e => {
      e.preventDefault();
      div.classList.remove('drop-hover');
      handleDrop(e.dataTransfer.getData('text/plain'), name, div);
    });
    $containers.appendChild(div);
  });
}

let touchItem = null, touchGhost = null;
function handleTouchStart(e) {
  if (state.locked) return;
  const el = e.currentTarget;
  const itemId = el.dataset.id;
  if (state.collected.includes(itemId)) return;
  e.preventDefault();
  touchItem = { id: itemId, el };
  el.classList.add('dragging');
  const touch = e.touches[0];
  const rect = el.getBoundingClientRect();
  touchGhost = el.cloneNode(true);
  Object.assign(touchGhost.style, {
    position: 'fixed',
    left: (touch.clientX - rect.width / 2) + 'px',
    top: (touch.clientY - rect.height / 2) + 'px',
    width: rect.width + 'px', zIndex: 9999,
    pointerEvents: 'none', opacity: 0.9, background: '#fff'
  });
  document.body.appendChild(touchGhost);
  startTimer();
}
function handleTouchMove(e) {
  if (!touchItem) return;
  e.preventDefault();
  const touch = e.touches[0];
  if (touchGhost) {
    touchGhost.style.left = (touch.clientX - touchGhost.offsetWidth / 2) + 'px';
    touchGhost.style.top = (touch.clientY - touchGhost.offsetHeight / 2) + 'px';
  }
  document.querySelectorAll('.container').forEach(c => c.classList.remove('drop-hover'));
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const cont = el && el.closest('.container');
  if (cont) cont.classList.add('drop-hover');
}
function handleTouchEnd(e) {
  if (!touchItem) return;
  e.preventDefault();
  const touch = e.changedTouches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const cont = el && el.closest('.container');
  document.querySelectorAll('.container').forEach(c => c.classList.remove('drop-hover'));
  if (touchGhost) touchGhost.remove();
  if (touchItem.el) touchItem.el.classList.remove('dragging');
  if (cont) handleDrop(touchItem.id, cont.dataset.container, cont);
  touchItem = null; touchGhost = null;
}

function handleDrop(itemId, containerName, dropEl) {
  if (state.locked) return;
  const item = ITEMS.find(i => i.id === itemId);
  if (!item || state.collected.includes(itemId)) return;
  const cfg = DIFFICULTY[state.diff];
  state.locked = true;
  stopTimer();

  if (item.container === containerName) {
    dropEl.classList.add('correct');
    state.score += cfg.points;
    state.collected.push(itemId);
    showMessage(`✅ Correct! ${item.container} ${item.name}`, 'ok');
    showSpeech(PHRASES_OK[Math.floor(Math.random() * PHRASES_OK.length)]);
    $cart.classList.add('bump');
    setTimeout(() => $cart.classList.remove('bump'), 400);
    const shelfEl = document.querySelector(`.item[data-id="${itemId}"]`);
    if (shelfEl) shelfEl.classList.add('collected');
    renderList();
    updateStats();
    setTimeout(() => {
      dropEl.classList.remove('correct');
      state.locked = false;
      hideSpeech();
      if (state.collected.length === state.targetItems.length) {
        setTimeout(nextLocation, 500);
      }
    }, 1100);
  } else {
    dropEl.classList.add('wrong');
    state.mistakes += 1;
    state.score = Math.max(0, state.score - 5);
    updateStats();
    showMessage(`❌ Oops! "${item.name}" goes in "${item.container}"`, 'err');
    showSpeech(PHRASES_ERR[Math.floor(Math.random() * PHRASES_ERR.length)]);
    setTimeout(() => {
      dropEl.classList.remove('wrong');
      state.locked = false;
      hideSpeech();
    }, 1300);
  }
}

function startTimer() {
  if (state.timer || state.locked) return;
  const cfg = DIFFICULTY[state.diff];
  state.timeLeft = cfg.time;
  updateTimer();
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimer();
    if (state.timeLeft <= 0) timeOut();
  }, 1000);
}
function stopTimer() {
  clearInterval(state.timer);
  state.timer = null;
  $timerBox.classList.remove('warn');
}
function updateTimer() {
  $timer.textContent = state.timeLeft + 's';
  $timerBox.classList.toggle('warn', state.timeLeft <= 3);
}
function timeOut() {
  stopTimer();
  state.mistakes += 1;
  state.score = Math.max(0, state.score - 3);
  updateStats();
  showMessage('⏰ Time is up! Try the next item.', 'err');
  showSpeech('Hurry up! ⏰');
  state.locked = true;
  setTimeout(() => { state.locked = false; hideMessage(); hideSpeech(); }, 1200);
}
function showMessage(text, type) {
  $message.textContent = text;
  $message.className = 'message ' + type;
}
function hideMessage() { $message.textContent = ''; $message.className = 'message'; }
function showSpeech(text) { $speech.textContent = text; $speech.classList.add('show'); }
function hideSpeech() { $speech.classList.remove('show'); }
function updateStats() {
  $score.textContent = state.score;
  $progress.textContent = `${state.collected.length}/${state.targetItems.length}`;
  $mistakes.textContent = state.mistakes;
}

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.diff = btn.dataset.diff;
    startGame();
  });
});

startGame();
</script>
